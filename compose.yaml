services:
  fess01:
    # In-development Fess 15.9 build. Pin a 15.9.x release tag (for example
    # ghcr.io/codelibs/fess:15.9.0-noble) once it is published.
    # The Ubuntu-based "-noble" variant is used because it ships ImageMagick,
    # poppler and LibreOffice, which Fess needs for PDF / Office / image
    # thumbnails. The plain ":snapshot" (Alpine) tag has none of them, so every
    # thumbnail request stays a 404; use it by setting FESS_IMAGE if you do not
    # need thumbnails.
    image: ${FESS_IMAGE:-ghcr.io/codelibs/fess:snapshot-noble}
    container_name: filesearch-fess01
    restart: unless-stopped
    ports:
      - "${FESS_HTTP_PORT:-8080}:8080"
    depends_on:
      search01:
        condition: service_healthy
      # Fess reads the embedding model id once at start (bin/fess-entrypoint.sh),
      # so it starts only after init-semantic has deployed the model.
      init-semantic:
        condition: service_completed_successfully
    environment:
      SEARCH_ENGINE_HTTP_URL: "http://search01:9200"
      FESS_DICTIONARY_PATH: "/usr/share/opensearch/config/dictionary/"
      FESS_HEAP_SIZE: "1g"
      # fess_config.properties overrides (-Dfess.config.<key>=<value>). Dynamic
      # system settings live in data/fess/opt/fess/system.properties instead
      # (see bin/setup.sh).
      #   adaptive.load.control=0       never throttle the small crawl
      #   file.role.from.file=false     do not turn the file owner and group into
      #   smb.role.from.file=false      roles: they are part of the document id, so
      #                                 a changed owner re-indexes the file (see README)
      #   query.additional.sort.fields  allow sort=filetype.* and sort=url.*
      #   crawler.document.cache.*      keep the extracted text of text, PDF and
      #                                 Office files so /api/v2/cache/{docId}
      #                                 can show a preview
      #   theme.index.frame.ancestors=  empty: the theme pages send no frame-ancestors
      #                                 directive, so WebKit (Safari) shows the preview
      #                                 and cache frames; X-Frame-Options: DENY still
      #                                 keeps the pages out of frames (default 'none')
      #   rank.fusion.engine.enabled    OpenSearch fuses the keyword and the vector
      #                                 query in one `hybrid` request (default false).
      #                                 RANK_FUSION_ENGINE=false: Fess fuses them itself
      #   query.additional.*response.fields
      #                                 `searcher` in /api/v2/search: which half matched
      #                                 a hit (default = keyword, semantic_chunk = vector)
      # content_chunker.* (the vector half) is read ONLY from the system-properties
      # channel, so it is passed as -Dfess.system.* (-Dfess.config.content_chunker.* is
      # ignored). A value in data/fess/opt/fess/system.properties would win over these,
      # so keep content_chunker.* out of that file. bin/fess-entrypoint.sh adds the
      # embedding model id.
      #   embedding.dimension  must match the model; fixed in the index mapping when
      #                        the index is created
      #   length.chunk_size    characters per chunk (README, Hybrid search)
      #   search.min_score     minimum cosine similarity for the vector half
      #   search.enabled       SEMANTIC_SEARCH=false: keyword search only
      FESS_JAVA_OPTS: >-
        -Dfess.config.adaptive.load.control=0
        -Dfess.config.file.role.from.file=false
        -Dfess.config.smb.role.from.file=false
        -Dfess.config.query.additional.sort.fields=filetype,url
        -Dfess.config.crawler.document.cache.enabled=true
        -Dfess.config.crawler.document.cache.supported.mimetypes=text/html,text/plain,text/csv,text/markdown,text/x-web-markdown,text/x-log,application/json,application/xml,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation
        -Dfess.config.theme.index.frame.ancestors=
        -Dfess.config.rank.fusion.engine.enabled=${RANK_FUSION_ENGINE:-true}
        -Dfess.config.query.additional.response.fields=searcher
        -Dfess.config.query.additional.api.response.fields=searcher
        -Dfess.system.content_chunker.enabled=true
        -Dfess.system.content_chunker.search.enabled=${SEMANTIC_SEARCH:-true}
        -Dfess.system.content_chunker.embedding.dimension=${MODEL_DIMENSION:-384}
        -Dfess.system.content_chunker.length.chunk_size=${CHUNK_SIZE:-500}
        -Dfess.system.content_chunker.search.min_score=${SEMANTIC_MIN_SCORE:-0.35}
    entrypoint: ["sh", "/fess-entrypoint.sh"]
    networks:
      - filesearch_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./bin/fess-entrypoint.sh:/fess-entrypoint.sh:ro
      - ./data/semantic:/semantic:ro
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/themes/${THEME_NAME:-filesearch}:/usr/share/fess/app/themes/${THEME_NAME:-filesearch}
      # Sample file tree (bin/seed-sample.sh), crawled as file:///data/files/
      - ./data/files:/data/files:ro

  search01:
    # ghcr.io/codelibs/fess-opensearch ships the plugins the hybrid search needs:
    # k-NN (chunk vectors), ML Commons (hosts the embedding model) and Neural
    # Search (the `hybrid` query).
    image: ghcr.io/codelibs/fess-opensearch:3.8.0
    container_name: filesearch-search01
    restart: unless-stopped
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-search
      - bootstrap.memory_lock=true
      # `ml` lets ML Commons run the embedding model on this node.
      - node.roles=cluster_manager,data,ingest,ml
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
      # OpenSearch blocks index creation while the disk is more than 90% full,
      # and the crawler then fails. The sample data is tiny, so do not let a
      # nearly full developer disk get in the way.
      - cluster.routing.allocation.disk.threshold_enabled=false
      # Concurrent segment search gives a one-node demo index nothing, and with it
      # some searches carrying the theme's `last_modified:[now/d-... TO *]` facets
      # fail on a shard and come back partial (README, Troubleshooting).
      - search.concurrent_segment_search.mode=none
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    ports:
      # Security is disabled and the node hosts ML Commons (anyone reaching this
      # port could register models), so publish OpenSearch on loopback only.
      - "127.0.0.1:${SEARCH_HTTP_PORT:-9200}:9200"
    networks:
      - filesearch_net

  # One-shot: register and deploy the embedding model in OpenSearch ML Commons,
  # then hand its generated id to fess01 through ./data/semantic. Re-running
  # reuses the deployed model. The first run downloads the model (~490 MB) and
  # installs curl and jq from the Alpine index; later runs work offline as long
  # as the model is still deployed (bin/setup-semantic.sh).
  init-semantic:
    image: alpine:3.24
    depends_on:
      search01:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://search01:9200
      - MODEL_NAME=${MODEL_NAME:-huggingface/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - MODEL_VERSION=${MODEL_VERSION:-1.0.1}
      - MODEL_DIMENSION=${MODEL_DIMENSION:-384}
      - MODEL_ID_FILE=/semantic/model_id
      - MAX_WAIT=${MODEL_MAX_WAIT:-900}
    volumes:
      - ./bin/setup-semantic.sh:/setup-semantic.sh:ro
      - ./data/semantic:/semantic
    entrypoint: ["/bin/sh", "/setup-semantic.sh"]
    restart: "no"
    networks:
      - filesearch_net

  # Optional: the same files exported over SMB, so the tree shows
  # \\samba01\share\... paths. Start with: docker compose --profile smb up -d
  # and crawl it with: bash bin/configure.sh --smb
  # The tag is pinned on purpose; when you bump it, re-check bin/configure.sh --smb.
  samba01:
    image: dockurr/samba:4.23.10
    container_name: filesearch-samba01
    profiles: ["smb"]
    restart: unless-stopped
    environment:
      NAME: "share"
      USER: "filesearch"
      PASS: "filesearch"
      RW: "N"
    volumes:
      - ./data/files:/storage:ro
    networks:
      - filesearch_net

networks:
  filesearch_net:
    driver: bridge
